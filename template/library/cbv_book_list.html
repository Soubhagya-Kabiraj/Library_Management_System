<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book List</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            margin: 0;
            padding: 0;
            color: #fff;
        }

        h1 {
            text-align: center;
            padding: 30px 0;
            letter-spacing: 2px;
        }

        .container {
            width: 85%;
            margin: auto;
            background: #ffffff10;
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 50%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 10px;
            margin-left: auto;
            margin-right: auto;
        }

        th {
            background: #6a11cb;
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            padding: 14px;
            text-transform: uppercase;
            font-size: 14px;
        }

        td {
            text-align: center;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
        }

        tr {
            transition: 0.3s ease;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.01);
        }

        a {
            color: #ffd369;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        @media screen and (max-width: 768px) {

            table,
            th,
            td {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <h1>📚 Booktech Library</h1>

    <div class="container">
        <table>
            <tr>
                <th>ID</th>
                <th>Title</th>
            </tr>

            {% for book in books %}
            <tr>
                <td>{{ book.id }}</td>
                <td>
                    <a href="{% url 'book_detail_cbv' book.pk %}">
                        {{ book.title }}
                    </a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>

</html>
