<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book & Author</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Layout */
        .container {
            display: flex;
            justify-content: center;
        }

        /* Main card (Book form) */
        .card {
            width: 440px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.25);
            animation: fadeUp 0.8s ease;
        }

        /* Nested card (Author form) */
        .card .card {
            margin-top: 30px;
            padding: 28px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            animation: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            margin-bottom: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 22px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        /* Django form spacing */
        form p {
            margin-bottom: 16px;
        }

        label {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Inputs */
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: none;
            outline: none;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: #e0e0e0;
        }

        input:focus,
        select:focus,
        textarea:focus {
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);
        }

        /* Button */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff512f, #dd2476);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            opacity: 0.95;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .card {
                width: 95%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <h1>Add a New Book</h1>
            <form method="post">
                {% csrf_token %}
                {{ book_form.as_p }}
                <h1>Add an Author</h1>
                {{ author_form.as_p }}
                <h1>Add a Publlisher</h1>
                {{ publisher_form.as_p }}
                <button type="submit">Save</button>
            </form>
        </div>
    </div>

</body>

</html>
